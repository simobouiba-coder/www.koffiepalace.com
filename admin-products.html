<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Producten – Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Georgia, serif;
      background: #0a0a0a;
      color: #f5f0e8;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      color: #c9a84c;
      margin-bottom: 30px;
    }
    .nav {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
      border-bottom: 1px solid #333;
      padding-bottom: 20px;
    }
    .nav a {
      color: #c9a84c;
      text-decoration: none;
      padding: 10px 20px;
      border: 1px solid #c9a84c;
      border-radius: 4px;
    }
    .nav a:hover {
      background: #c9a84c;
      color: #0a0a0a;
    }
    .section {
      background: #1a1a1a;
      padding: 30px;
      border-radius: 8px;
      margin-bottom: 30px;
    }
    .btn {
      background: #c9a84c;
      color: #0a0a0a;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .btn:hover {
      background: #e8c76a;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #333;
    }
    th {
      background: #0a0a0a;
      color: #c9a84c;
      font-weight: bold;
    }
    tr:hover {
      background: #0a0a0a;
    }
    .btn-small {
      background: #333;
      color: #f5f0e8;
      border: none;
      padding: 5px 10px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
      margin-right: 5px;
    }
    .btn-small:hover {
      background: #444;
    }
    .btn-delete {
      background: #c9534c;
    }
    .btn-delete:hover {
      background: #d9534f;
    }
    .loading {
      color: #888;
      text-align: center;
      padding: 40px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📦 Producten Beheren</h1>
    
    <div class="nav">
      <a href="/admin">Dashboard</a>
      <a href="/admin/products">Producten</a>
      <a href="/admin/orders">Bestellingen</a>
      <a href="/admin/settings">Instellingen</a>
    </div>

    <div class="section">
      <button class="btn" onclick="showAddForm()">+ Nieuw Product</button>
      
      <div id="addForm" style="display:none; background:#0a0a0a; padding:20px; border-radius:4px; margin-bottom:20px;">
        <h3 style="color:#c9a84c; margin-bottom:15px;">Nieuw Product</h3>
        <input type="text" id="slug" placeholder="Slug (bijv: palace-blend)" style="width:100%; padding:8px; margin-bottom:10px; background:#1a1a1a; color:#f5f0e8; border:1px solid #333; border-radius:4px;">
        <input type="text" id="name" placeholder="Naam" style="width:100%; padding:8px; margin-bottom:10px; background:#1a1a1a; color:#f5f0e8; border:1px solid #333; border-radius:4px;">
        <input type="text" id="category" placeholder="Categorie (beans/machines/onderdelen)" style="width:100%; padding:8px; margin-bottom:10px; background:#1a1a1a; color:#f5f0e8; border:1px solid #333; border-radius:4px;">
        <input type="number" id="price" placeholder="Prijs" step="0.01" style="width:100%; padding:8px; margin-bottom:10px; background:#1a1a1a; color:#f5f0e8; border:1px solid #333; border-radius:4px;">
        <textarea id="description" placeholder="Beschrijving" style="width:100%; padding:8px; margin-bottom:10px; background:#1a1a1a; color:#f5f0e8; border:1px solid #333; border-radius:4px; min-height:80px;"></textarea>
        <input type="text" id="image" placeholder="Afbeelding URL" style="width:100%; padding:8px; margin-bottom:10px; background:#1a1a1a; color:#f5f0e8; border:1px solid #333; border-radius:4px;">
        <button class="btn" onclick="addProduct()">Opslaan</button>
        <button class="btn-small" onclick="showAddForm()">Annuleren</button>
      </div>

      <div id="productsList" class="loading">Laden...</div>
    </div>
  </div>

  <script>
    const ADMIN_PASSWORD = prompt('Admin wachtwoord:') || 'admin';

    async function loadProducts() {
      try {
        const res = await fetch('/api/admin/products', {
          headers: { 'Authorization': `Bearer ${ADMIN_PASSWORD}` }
        });
        if (!res.ok) throw new Error('Niet geautoriseerd');
        const products = await res.json();
        
        let html = '<table><thead><tr><th>Naam</th><th>Categorie</th><th>Prijs</th><th>Acties</th></tr></thead><tbody>';
        products.forEach(p => {
          html += `<tr>
            <td>${p.name}</td>
            <td>${p.category}</td>
            <td>€ ${p.price}</td>
            <td>
              <button class="btn-small" onclick="editProduct('${p.slug}')">Bewerk</button>
              <button class="btn-small btn-delete" onclick="deleteProduct('${p.slug}')">Verwijder</button>
            </td>
          </tr>`;
        });
        html += '</tbody></table>';
        document.getElementById('productsList').innerHTML = html;
      } catch (err) {
        document.getElementById('productsList').innerHTML = `<div class="loading" style="color:#c9534c;">Fout: ${err.message}</div>`;
      }
    }

    function showAddForm() {
      const form = document.getElementById('addForm');
      form.style.display = form.style.display === 'none' ? 'block' : 'none';
    }

    async function addProduct() {
      const product = {
        slug: document.getElementById('slug').value,
        name: document.getElementById('name').value,
        category: document.getElementById('category').value,
        price: parseFloat(document.getElementById('price').value),
        description: document.getElementById('description').value,
        image: document.getElementById('image').value
      };

      if (!product.slug || !product.name || !product.category) {
        alert('Vul alle verplichte velden in');
        return;
      }

      try {
        const res = await fetch('/api/admin/products', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${ADMIN_PASSWORD}`
          },
          body: JSON.stringify(product)
        });
        if (!res.ok) throw new Error('Fout bij opslaan');
        alert('Product opgeslagen!');
        document.getElementById('addForm').style.display = 'none';
        document.getElementById('slug').value = '';
        document.getElementById('name').value = '';
        document.getElementById('category').value = '';
        document.getElementById('price').value = '';
        document.getElementById('description').value = '';
        document.getElementById('image').value = '';
        loadProducts();
      } catch (err) {
        alert('Fout: ' + err.message);
      }
    }

    async function deleteProduct(slug) {
      if (!confirm('Zeker weten?')) return;
      try {
        const res = await fetch(`/api/admin/products/${slug}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${ADMIN_PASSWORD}` }
        });
        if (!res.ok) throw new Error('Fout bij verwijderen');
        alert('Product verwijderd!');
        loadProducts();
      } catch (err) {
        alert('Fout: ' + err.message);
      }
    }

    function editProduct(slug) {
      alert('Edit functie komt binnenkort!');
    }

    loadProducts();
  </script>
</body>
</html>
