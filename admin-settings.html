<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instellingen – Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Georgia, serif;
      background: #0a0a0a;
      color: #f5f0e8;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      color: #c9a84c;
      margin-bottom: 30px;
    }
    .nav {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
      border-bottom: 1px solid #333;
      padding-bottom: 20px;
    }
    .nav a {
      color: #c9a84c;
      text-decoration: none;
      padding: 10px 20px;
      border: 1px solid #c9a84c;
      border-radius: 4px;
    }
    .nav a:hover {
      background: #c9a84c;
      color: #0a0a0a;
    }
    .section {
      background: #1a1a1a;
      padding: 30px;
      border-radius: 8px;
      max-width: 600px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      color: #c9a84c;
      margin-bottom: 8px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      background: #0a0a0a;
      color: #f5f0e8;
      border: 1px solid #333;
      border-radius: 4px;
      font-family: Georgia, serif;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #c9a84c;
    }
    .btn {
      background: #c9a84c;
      color: #0a0a0a;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
    .btn:hover {
      background: #e8c76a;
    }
    .loading {
      color: #888;
      text-align: center;
      padding: 40px;
    }
    .success {
      background: #5cb85c;
      color: #fff;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚙️ Instellingen</h1>
    
    <div class="nav">
      <a href="/admin">Dashboard</a>
      <a href="/admin/products">Producten</a>
      <a href="/admin/orders">Bestellingen</a>
      <a href="/admin/settings">Instellingen</a>
    </div>

    <div class="section">
      <div id="success" class="success">✅ Instellingen opgeslagen!</div>
      
      <div id="settingsForm" class="loading">Laden...</div>
    </div>
  </div>

  <script>
    const ADMIN_PASSWORD = prompt('Admin wachtwoord:') || 'admin';

    async function loadSettings() {
      try {
        const res = await fetch('/api/settings');
        if (!res.ok) throw new Error('Fout bij laden');
        const settings = await res.json();
        
        let html = '';
        const fields = ['telefoon', 'whatsapp', 'email', 'adres', 'openingstijden'];
        
        fields.forEach(field => {
          const label = field.charAt(0).toUpperCase() + field.slice(1);
          const value = settings[field] || '';
          html += `
            <div class="form-group">
              <label for="${field}">${label}</label>
              <input type="text" id="${field}" value="${value}">
            </div>
          `;
        });
        
        html += '<button class="btn" onclick="saveSettings()">Opslaan</button>';
        document.getElementById('settingsForm').innerHTML = html;
      } catch (err) {
        document.getElementById('settingsForm').innerHTML = `<div class="loading" style="color:#c9534c;">Fout: ${err.message}</div>`;
      }
    }

    async function saveSettings() {
      const settings = {
        telefoon: document.getElementById('telefoon').value,
        whatsapp: document.getElementById('whatsapp').value,
        email: document.getElementById('email').value,
        adres: document.getElementById('adres').value,
        openingstijden: document.getElementById('openingstijden').value
      };

      try {
        const res = await fetch('/api/admin/settings', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${ADMIN_PASSWORD}`
          },
          body: JSON.stringify(settings)
        });
        if (!res.ok) throw new Error('Fout bij opslaan');
        
        const successDiv = document.getElementById('success');
        successDiv.style.display = 'block';
        setTimeout(() => { successDiv.style.display = 'none'; }, 3000);
      } catch (err) {
        alert('Fout: ' + err.message);
      }
    }

    loadSettings();
  </script>
</body>
</html>
